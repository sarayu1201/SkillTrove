<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Login - SkillTrove</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Raleway:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2746a3;
            --secondary-blue: #296dae;
            --accent-cyan: #32f7a6;
            --gradient-teal: #38dedd;
            --soft-sky: #f6f9fd;
            --white: #ffffff;
            --card-shadow: #c5dbff31;
            --card-border: #cae8ff;
            --text-main: #264072;
            --header-navy: #23375b;
            --professional-gold: #d4af37;
            --professional-dark: #1a1a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Manrope', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--professional-dark) 0%, var(--primary-blue) 50%, var(--professional-gold) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            animation: float 8s ease-in-out infinite;
        }

        .floating-shape:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 15%;
            left: 15%;
            animation-delay: 0s;
        }

        .floating-shape:nth-child(2) {
            width: 150px;
            height: 150px;
            top: 70%;
            right: 15%;
            animation-delay: 3s;
        }

        .floating-shape:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 30%;
            left: 25%;
            animation-delay: 6s;
        }

        .floating-shape:nth-child(4) {
            width: 200px;
            height: 200px;
            top: 40%;
            right: 30%;
            animation-delay: 1s;
            background: rgba(50, 247, 166, 0.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 0.8; }
        }

        /* Login Container */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 3rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-header .logo {
            font-family: 'Raleway', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-header .logo i {
            color: var(--professional-gold);
            font-size: 2.5rem;
        }

        .login-header h2 {
            color: var(--header-navy);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .login-header p {
            color: var(--text-main);
            font-size: 1rem;
        }

        /* Form Styles */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1.2rem;
            padding-left: 3.5rem;
            border: 2px solid var(--card-border);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--soft-sky);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--professional-gold);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
            background: var(--white);
        }

        .form-group i {
            position: absolute;
            left: 1.2rem;
            top: 3.2rem;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        .form-group select {
            cursor: pointer;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--professional-dark), var(--professional-gold));
            color: var(--white);
            border: none;
            padding: 1.2rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(26, 26, 46, 0.4);
        }

        .login-options-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .login-options-links a {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .login-options-links a:hover {
            color: var(--professional-gold);
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .professional-badge {
            background: linear-gradient(135deg, var(--professional-gold), #f4d03f);
            color: var(--professional-dark);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                margin: 1rem;
                padding: 2rem;
            }
            
            .back-btn {
                top: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="login-container">
        <div class="login-header">
            <div class="professional-badge">
                <i class="fas fa-crown"></i> Professional Portal
            </div>
            <div class="logo">
                <i class="fas fa-user-tie"></i>
                SkillTrove
            </div>
            <h2>Professional Access</h2>
            <p>Advance your career with professional insights</p>
        </div>

        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Professional Email</label>
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Enter your work email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="industry">Industry</label>
                <i class="fas fa-building"></i>
                <select id="industry" name="industry" required>
                    <option value="">Select your industry</option>
                    <option value="technology">Technology</option>
                    <option value="finance">Finance</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="education">Education</option>
                    <option value="marketing">Marketing</option>
                    <option value="consulting">Consulting</option>
                    <option value="manufacturing">Manufacturing</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-briefcase"></i> Access Professional Dashboard
            </button>

            <div class="login-options-links">
                <a href="#forgot">Forgot Password?</a>
                <a href="#signup">Professional Signup</a>
            </div>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const industry = document.getElementById('industry').value;
            
            if (email && password && industry) {
                document.querySelector('.login-btn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
                
                setTimeout(() => {
                    window.location.href = 'professional-dashboard.html';
                }, 1500);
            }
        }

        // Add floating animation to login container
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.login-container');
            container.style.animation = 'slideUp 0.8s ease-out';
        });

        // Add CSS for slide up animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(50px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
