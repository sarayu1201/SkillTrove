<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Quiz Arena - SkillTrove</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2746a3;
            --secondary-blue: #296dae;
            --accent-cyan: #32f7a6;
            --gradient-teal: #38dedd;
            --soft-sky: #f6f9fd;
            --white: #ffffff;
            --text-main: #264072;
            --header-navy: #23375b;
            --neon-green: #00ff41;
            --neon-blue: #0080ff;
            --neon-purple: #8000ff;
            --neon-pink: #ff0080;
            --dark-bg: #0a0a0a;
            --game-dark: #1a1a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--game-dark) 50%, var(--primary-blue) 100%);
            min-height: 100vh;
            font-family: 'Manrope', sans-serif;
            color: var(--white);
            overflow-x: hidden;
        }

        /* Animated Background */
        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .neon-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-green);
            border-radius: 50%;
            animation: float-particle 4s linear infinite;
            box-shadow: 0 0 10px var(--neon-green);
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        /* Header */
        .game-header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-green);
            position: relative;
            z-index: 100;
        }

        .logo-game {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
            animation: pulse-glow 2s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 20px var(--neon-green); }
            to { text-shadow: 0 0 30px var(--neon-green), 0 0 40px var(--accent-cyan); }
        }

        .game-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-item {
            text-align: center;
            font-family: 'Orbitron', monospace;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--accent-cyan);
        }

        /* Main Game Container */
        .game-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
            position: relative;
            z-index: 10;
        }

        .quiz-arena {
            background: rgba(26, 26, 46, 0.95);
            border-radius: 25px;
            padding: 2rem;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 50px rgba(0, 128, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .quiz-arena::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
            animation: scan-line 3s linear infinite;
        }

        @keyframes scan-line {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .quiz-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--neon-green), var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: rainbow-shift 3s ease-in-out infinite;
        }

        @keyframes rainbow-shift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg); }
        }

        .quiz-subtitle {
            color: var(--accent-cyan);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        /* Progress Bar */
        .progress-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 25px;
            padding: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--neon-blue);
        }

        .progress-bar {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 20px;
            height: 20px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            border-radius: 20px;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px var(--neon-green);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--white);
            text-shadow: 0 0 10px var(--dark-bg);
        }

        /* Question Card */
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(128, 0, 255, 0.2);
            position: relative;
            z-index: 2;
        }

        .question-number {
            font-family: 'Orbitron', monospace;
            color: var(--neon-pink);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* Answer Options */
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .answer-option {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .answer-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.2), transparent);
            transition: left 0.5s;
        }

        .answer-option:hover::before {
            left: 100%;
        }

        .answer-option:hover {
            border-color: var(--neon-green);
            background: rgba(0, 255, 65, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.3);
        }

        .answer-option.selected {
            border-color: var(--neon-green);
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.5);
        }

        .answer-option.correct {
            border-color: var(--neon-green);
            background: rgba(0, 255, 65, 0.3);
            animation: correct-pulse 1s ease-in-out;
        }

        .answer-option.incorrect {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 128, 0.3);
            animation: incorrect-shake 0.5s ease-in-out;
        }

        @keyframes correct-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes incorrect-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .answer-letter {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            color: var(--neon-blue);
            margin-right: 1rem;
            font-size: 1.2rem;
        }

        .answer-text {
            font-weight: 500;
            color: var(--white);
        }

        /* Control Buttons */
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            position: relative;
            z-index: 2;
        }

        .btn-game {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: var(--white);
            border: none;
            padding: 1rem 2rem;
            border-radius: 15px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-game:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 128, 255, 0.5);
        }

        .btn-game:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            animation: timer-pulse 1s ease-in-out infinite;
        }

        @keyframes timer-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Score Display */
        .score-display {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: rgba(26, 26, 46, 0.9);
            border: 2px solid var(--neon-green);
            border-radius: 15px;
            padding: 1rem;
            z-index: 200;
            backdrop-filter: blur(20px);
        }

        .score-value {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
        }

        .score-label {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Game Over Screen */
        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .game-over-content {
            background: rgba(26, 26, 46, 0.95);
            border: 3px solid var(--neon-green);
            border-radius: 25px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 0 50px var(--neon-green);
        }

        .final-score {
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 30px var(--neon-green);
            margin: 1rem 0;
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 2px solid var(--neon-blue);
            padding: 1rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(0, 128, 255, 0.2);
            transform: translateX(-5px);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-container {
                padding: 0 1rem;
            }
            
            .quiz-arena {
                padding: 1.5rem;
            }
            
            .answers-grid {
                grid-template-columns: 1fr;
            }
            
            .quiz-controls {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-bg" id="gameBg"></div>

    <button class="back-btn" onclick="window.location.href='Aimentoring.html'">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="score-display">
        <div class="score-value" id="scoreValue">0</div>
        <div class="score-label">SCORE</div>
    </div>

    <header class="game-header">
        <div class="logo-game">
            <i class="fas fa-gamepad"></i> QUIZ ARENA
        </div>
        <div class="game-stats">
            <div class="stat-item">
                <div class="stat-value" id="level">1</div>
                <div class="stat-label">LEVEL</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">STREAK</div>
            </div>
        </div>
    </header>

    <div class="game-container">
        <div class="quiz-arena">
            <div class="quiz-header">
                <h1 class="quiz-title">KNOWLEDGE BATTLE</h1>
                <p class="quiz-subtitle">Test your skills in the ultimate learning arena</p>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    <div class="progress-text" id="progressText">Question 1 of 10</div>
                </div>
            </div>

            <div class="question-card">
                <div class="question-number" id="questionNumber">QUESTION 01</div>
                <div class="question-text" id="questionText">
                    What is the time complexity of a binary search algorithm?
                </div>
                
                <div class="answers-grid" id="answersGrid">
                    <div class="answer-option" onclick="selectAnswer(this, false)">
                        <span class="answer-letter">A</span>
                        <span class="answer-text">O(n)</span>
                    </div>
                    <div class="answer-option" onclick="selectAnswer(this, true)">
                        <span class="answer-letter">B</span>
                        <span class="answer-text">O(log n)</span>
                    </div>
                    <div class="answer-option" onclick="selectAnswer(this, false)">
                        <span class="answer-letter">C</span>
                        <span class="answer-text">O(n²)</span>
                    </div>
                    <div class="answer-option" onclick="selectAnswer(this, false)">
                        <span class="answer-letter">D</span>
                        <span class="answer-text">O(1)</span>
                    </div>
                </div>
            </div>

            <div class="quiz-controls">
                <div class="timer" id="timer">30</div>
                <button class="btn-game" id="nextBtn" onclick="nextQuestion()" disabled>
                    <i class="fas fa-arrow-right"></i> NEXT QUESTION
                </button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2 style="color: var(--neon-green); font-family: 'Orbitron', monospace; font-size: 2rem; margin-bottom: 1rem;">
                GAME COMPLETE!
            </h2>
            <div class="final-score" id="finalScore">0</div>
            <p style="color: var(--accent-cyan); margin-bottom: 2rem;">
                Excellent performance in the Knowledge Arena!
            </p>
            <button class="btn-game" onclick="restartQuiz()">
                <i class="fas fa-redo"></i> PLAY AGAIN
            </button>
            <button class="btn-game" onclick="window.location.href='Aimentoring.html'" style="margin-left: 1rem;">
                <i class="fas fa-home"></i> DASHBOARD
            </button>
        </div>
    </div>

    <script>
        let currentQuestion = 1;
        let score = 0;
        let streak = 0;
        let timeLeft = 30;
        let timerInterval;
        let selectedAnswer = null;

        const questions = [
            {
                question: "What is the time complexity of a binary search algorithm?",
                options: ["O(n)", "O(log n)", "O(n²)", "O(1)"],
                correct: 1
            },
            {
                question: "Which data structure uses LIFO (Last In, First Out) principle?",
                options: ["Queue", "Stack", "Array", "Linked List"],
                correct: 1
            },
            {
                question: "What does HTML stand for?",
                options: ["Hyper Text Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlink and Text Markup Language"],
                correct: 0
            },
            {
                question: "Which programming language is known for 'Write Once, Run Anywhere'?",
                options: ["Python", "C++", "Java", "JavaScript"],
                correct: 2
            },
            {
                question: "What is the primary purpose of CSS?",
                options: ["Database management", "Styling web pages", "Server-side logic", "Data analysis"],
                correct: 1
            }
        ];

        function initializeGame() {
            createParticles();
            startTimer();
            loadQuestion();
        }

        function createParticles() {
            const bg = document.getElementById('gameBg');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'neon-particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (3 + Math.random() * 2) + 's';
                bg.appendChild(particle);
            }
        }

        function startTimer() {
            timeLeft = 30;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                
                if (timeLeft <= 10) {
                    document.getElementById('timer').style.color = 'var(--neon-pink)';
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentQuestion > questions.length) {
                endGame();
                return;
            }

            const question = questions[currentQuestion - 1];
            document.getElementById('questionNumber').textContent = `QUESTION ${currentQuestion.toString().padStart(2, '0')}`;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('progressText').textContent = `Question ${currentQuestion} of ${questions.length}`;
            document.getElementById('progressFill').style.width = `${(currentQuestion - 1) / questions.length * 100}%`;

            const answersGrid = document.getElementById('answersGrid');
            answersGrid.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const answerDiv = document.createElement('div');
                answerDiv.className = 'answer-option';
                answerDiv.onclick = () => selectAnswer(answerDiv, index === question.correct);
                answerDiv.innerHTML = `
                    <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
                    <span class="answer-text">${option}</span>
                `;
                answersGrid.appendChild(answerDiv);
            });

            selectedAnswer = null;
            document.getElementById('nextBtn').disabled = true;
        }

        function selectAnswer(element, isCorrect) {
            if (selectedAnswer) return;

            selectedAnswer = element;
            clearInterval(timerInterval);

            document.querySelectorAll('.answer-option').forEach(option => {
                option.style.pointerEvents = 'none';
            });

            if (isCorrect) {
                element.classList.add('correct');
                score += 100 + (timeLeft * 5); // Bonus for quick answers
                streak++;
                updateScore();
                playSound('correct');
            } else {
                element.classList.add('incorrect');
                streak = 0;
                playSound('incorrect');
                
                // Show correct answer
                document.querySelectorAll('.answer-option').forEach((option, index) => {
                    if (questions[currentQuestion - 1].correct === index) {
                        option.classList.add('correct');
                    }
                });
            }

            document.getElementById('nextBtn').disabled = false;
            
            setTimeout(() => {
                if (currentQuestion < questions.length) {
                    document.getElementById('nextBtn').textContent = 'NEXT QUESTION';
                } else {
                    document.getElementById('nextBtn').textContent = 'FINISH GAME';
                }
            }, 1000);
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion > questions.length) {
                endGame();
                return;
            }

            // Reset for next question
            document.querySelectorAll('.answer-option').forEach(option => {
                option.style.pointerEvents = 'auto';
                option.classList.remove('selected', 'correct', 'incorrect');
            });

            loadQuestion();
            startTimer();
            document.getElementById('timer').style.color = 'var(--neon-pink)';
        }

        function updateScore() {
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('streak').textContent = streak;
            
            // Level up every 500 points
            const level = Math.floor(score / 500) + 1;
            document.getElementById('level').textContent = level;
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'flex';
            playSound('gameOver');
        }

        function restartQuiz() {
            currentQuestion = 1;
            score = 0;
            streak = 0;
            updateScore();
            document.getElementById('gameOver').style.display = 'none';
            loadQuestion();
            startTimer();
        }

        function playSound(type) {
            // Audio feedback simulation with visual effects
            const body = document.body;
            if (type === 'correct') {
                body.style.boxShadow = 'inset 0 0 100px rgba(0, 255, 65, 0.2)';
            } else if (type === 'incorrect') {
                body.style.boxShadow = 'inset 0 0 100px rgba(255, 0, 128, 0.2)';
            }
            
            setTimeout(() => {
                body.style.boxShadow = 'none';
            }, 500);
        }

        // Initialize game on load
        document.addEventListener('DOMContentLoaded', initializeGame);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '4') {
                const options = document.querySelectorAll('.answer-option');
                if (options[e.key - 1] && !selectedAnswer) {
                    options[e.key - 1].click();
                }
            }
            if (e.key === 'Enter' && !document.getElementById('nextBtn').disabled) {
                nextQuestion();
            }
        });
    </script>
</body>
</html>
